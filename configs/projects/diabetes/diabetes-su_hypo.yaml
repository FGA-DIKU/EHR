# @package _global_
defaults:
  - /core/base_create@
  - _self_

dataset: phair_light

paths: 
  input_dir: FILL_OUT_THIS/${dataset}
  save_path: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}/outcomes/${hydra:job.config_name}.parquet

splits:
  - train
  - tuning
  - held_out

index:
  missing: drop
  mode: match
  args:
    dependence: any
    occurence: first
    conditions:
      - column: code
        value: [ MEDICATION//A10BB ]
        operator: startswith_any 

outcome:
  mode: match
  args:
    dependence: all_row
    occurence: first
    conditions:
        - column: code
          value: [DIAGNOSIS//DE160, DIAGNOSIS//DE161, DIAGNOSIS//DE162]
          operator: startswith_any 
        - column: time
          operator: gt
          value_col: index_date

censor:
  mode: offset
  args:
    offset_by: 0d

cohort:
  conditional_criteria:
    - action: exclude #exclude outcomes prior to index
      args:
        dependence: all_row
        occurence: all
        conditions:
            - column: code
              value: [DIAGNOSIS//DE160, DIAGNOSIS//DE161, DIAGNOSIS//DE162]
              operator: startswith_any 
            - column: time
              operator: lt
              value_col: index_date

    # Our diabetes cohort exclude/include
    - action: exclude
      args: 
        dependence: any
        occurence: all
        conditions:
          - column: code
            value: [DIAGNOSIS//DE10]
            operator: startswith_any 
    - action: include
      args:
        dependence: any
        occurence: all
        conditions:
          - column: code
            value: [MEDICATION//A10]
            operator: startswith_any 
          - column: code
            value: [DIAGNOSIS//DE11]
            operator: startswith_any
