# @package _global_
defaults:
  - /core/base_create@
  - _self_

dataset: correlated_MEDS_data

paths: 
  input_dir: example_data/${dataset}
  save_path: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}/outcomes/${hydra:job.config_name}.parquet

splits:
  - train
  - tuning
  - held_out

index:
  missing: drop
  mode: date
  args:
    year: 2023
    month: 1
    day: 1

outcome:
  mode: match
  args:
    dependence: any
    conditions:
      - column: code
        value: [ SYN//Negative ]
        operator: startswith_any
    occurence: first

censor:
  mode: offset
  args:
    offset_by: 0d

cohort:
  conditional_criteria:
    - action: exclude
      args:
        dependence: all_row
        conditions: 
        - column: code
          value: [ SYN//Negative ]
          operator: startswith_any
        - column: time
          operator: lt
          value_col: index_date
