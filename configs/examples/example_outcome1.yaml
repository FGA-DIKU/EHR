# @package _global_
defaults:
  - /core/base_create@
  - _self_

dataset: correlated_MEDS_data

paths: 
  input_dir: example_data/${dataset}
  save_path: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}/outcomes/${hydra:job.config_name}.parquet

splits:
  - train
  - tuning
  - held_out

index:
  missing: drop
  mode: date
  args:
    year: 2020
    month: 1
    day: 1

outcome:
  mode: match
  args:
    occurrence: first
    criteria:
      all_row:
        - {column: code, value: [ DIAGNOSIS//SYN_POS_DIAG ], operator: startswith_any}
        - {column: time, operator: gt, value_col: index_date}

censor:
  mode: offset
  args:
    offset_by: -1000h

cohort:
  conditional_criteria:
    - action: exclude
      args:
        occurrence: all
        criteria:
          all_row:
            - {column: code, value: [ DIAGNOSIS//SYN_POS_DIAG ], operator: startswith_any}
            - {column: time, operator: lt, value_col: index_date}
    - action: exclude
      args:
        occurrence: all
        criteria:
          all_row:
            - {column: code, value: [ LABTEST//NPUD220 ], operator: startswith_any}
            - {column: time, operator: lt, value_col: index_date}
